name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - review/**

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install pytest ruff mypy bandit pip-audit
      - name: Static secret scan
        run: python scripts/check_static_secrets.py
      - name: Ruff fatal checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Type import checks
        run: >
          mypy --ignore-missing-imports --follow-imports=skip
          --disable-error-code import-untyped
          --disable-error-code var-annotated
          --disable-error-code arg-type
          --disable-error-code assignment
          --disable-error-code operator
          app.py routes services providers streaming
      - name: Bandit security scan
        run: >
          bandit -q -c .bandit
          -r app.py config.py error_handlers.py route_helpers.py routes services providers streaming
      - name: Dependency audit
        run: pip-audit -r requirements.lock
      - name: Python tests
        run: python -m pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Node audit
        run: npm audit --audit-level=high
      - name: Worker tests
        run: npm run test:worker
