<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#07131f">
    <title>Offline · MultiLLM Proxy</title>
    <!-- Self-contained: this page must render without the network or other assets. -->
    <style>
        :root {
            --ink-950: #07131f;
            --ink-600: #476277;
            --ink-200: #ccd7df;
            --ink-50: #f3f7f9;
            --cyan-700: #0a6b78;
            --cyan-600: #0891a4;
            --cyan-400: #42d1c5;
            --cyan-100: #d8f1f3;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 1.25rem;
            place-items: center;
            background:
                linear-gradient(rgb(7 19 31 / 2.5%) 1px, transparent 1px),
                linear-gradient(90deg, rgb(7 19 31 / 2.5%) 1px, transparent 1px),
                var(--ink-50);
            background-size: 2rem 2rem;
            color: var(--ink-950);
            font: 1rem/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        main {
            display: grid;
            width: min(100%, 38rem);
            padding: clamp(1.5rem, 5vw, 3rem);
            gap: 1rem;
            border: 1px solid var(--ink-200);
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 12px 32px rgb(7 19 31 / 9%);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand span:last-child span { color: var(--ink-600); font-weight: 500; }

        .mark {
            position: relative;
            width: 2rem;
            height: 2rem;
            border-radius: 0.55rem;
            background: var(--ink-950);
        }

        .mark i {
            position: absolute;
            left: 0.48rem;
            height: 2px;
            border-radius: 2px;
            background: var(--cyan-100);
        }

        .mark i:nth-child(1) { top: 0.56rem; width: 0.7rem; }
        .mark i:nth-child(2) { top: 0.95rem; width: 1rem; }
        .mark i:nth-child(3) { top: 1.34rem; width: 0.5rem; }
        .mark::after {
            position: absolute;
            top: 0.84rem;
            right: 0.4rem;
            width: 0.32rem;
            height: 0.32rem;
            border-radius: 50%;
            background: var(--cyan-400);
            content: "";
        }

        .eyebrow {
            margin: 0.75rem 0 0;
            color: var(--cyan-700);
            font: 700 0.75rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.9rem, 6vw, 2.6rem);
            letter-spacing: -0.04em;
            line-height: 1.08;
        }

        p { margin: 0; color: var(--ink-600); line-height: 1.65; }

        nav { display: flex; margin-top: 0.5rem; flex-wrap: wrap; gap: 0.6rem; }

        a {
            display: inline-flex;
            min-height: 2.75rem;
            padding: 0 1rem;
            align-items: center;
            border: 1px solid var(--ink-200);
            border-radius: 0.45rem;
            background: #fff;
            color: var(--ink-950);
            font-weight: 650;
            font-size: 0.875rem;
            text-decoration: none;
        }

        a.primary { border-color: var(--ink-950); background: var(--ink-950); color: #fff; }
        a:focus-visible { outline: 3px solid var(--cyan-600); outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span>MultiLLM<span> Proxy</span></span></div>
        <p class="eyebrow">You are offline</p>
        <h1>This page needs a connection.</h1>
        <p>Live routing health, request records and Knowledge status come from the server, so they are not shown while the network is unavailable. Nothing is queued or retried in the background.</p>
        <nav aria-label="Offline recovery">
            <a class="primary" href="">Try again</a>
            <a href="/login">Sign in</a>
        </nav>
    </main>
</body>
</html>
