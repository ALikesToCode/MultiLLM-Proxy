<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07131f">
    <title>Offline · MultiLLM Proxy</title>
    <style>
        :root {
            --ink: #07131f;
            --muted: #657c8e;
            --border: #ccd7df;
            --surface: #ffffff;
            --background: #f3f7f9;
            --cyan: #087d8d;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 1.25rem;
            place-items: center;
            background:
                linear-gradient(rgb(7 19 31 / 3%) 1px, transparent 1px),
                linear-gradient(90deg, rgb(7 19 31 / 3%) 1px, transparent 1px),
                var(--background);
            background-size: 2rem 2rem;
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        }

        main {
            width: min(100%, 42rem);
            padding: clamp(1.5rem, 5vw, 3.5rem);
            border: 1px solid var(--border);
            border-radius: 1.1rem;
            background: var(--surface);
            box-shadow: 0 16px 45px rgb(7 19 31 / 9%);
        }

        .eyebrow {
            margin: 0 0 0.8rem;
            color: var(--cyan);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.72rem;
            font-weight: 750;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 7vw, 4.3rem);
            line-height: 0.98;
            letter-spacing: -0.06em;
        }

        p:not(.eyebrow) {
            margin: 1rem 0 0;
            color: var(--muted);
            line-height: 1.65;
        }

        nav {
            display: flex;
            margin-top: 1.6rem;
            flex-wrap: wrap;
            gap: 0.65rem;
        }

        a {
            display: inline-flex;
            min-height: 2.7rem;
            padding: 0.7rem 1rem;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 0.45rem;
            background: var(--surface);
            color: var(--ink);
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
        }

        a:first-child {
            border-color: var(--ink);
            background: var(--ink);
            color: white;
        }

        a:focus-visible {
            outline: 3px solid rgb(8 145 164 / 35%);
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Network unavailable</p>
        <h1>Control plane is offline.</h1>
        <p>
            Cached interface assets remain available, but provider health and routes
            require a live connection. Reconnect, then retry the deployment.
        </p>
        <nav aria-label="Offline recovery">
            <a href="/">Retry operations</a>
            <a href="/login">Return to sign in</a>
        </nav>
    </main>
</body>
</html>
